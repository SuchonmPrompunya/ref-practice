<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#0f1216" />
    <title>Referee</title>
    <script src="ref-sandbox.js"></script>
    <!--
  Referee scoring.

  A plain page rather than part of the React app on purpose: the scoring logic
  is lifted from the DrillYard scoreboard app, where it has been used in real
  matches. Rewriting it as components would mean reintroducing bugs into the one
  part that must not have them.

  What changed from the original: it gets the match from Bracket instead of
  having names typed in, and sends the score to Bracket instead of rewriting an
  SVG file. The rules below are unchanged.
-->
    <style>
      :root {
        --bg: #0f1216;
        --card: #181d24;
        --line: #2a323d;
        --fg: #e8edf4;
        --dim: #8b98a8;
        --a: #4ea8de;
        --b: #f4a261;
        --ok: #43b581;
        --warn: #e0a800;
        --bad: #ff7b72;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      body {
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
      }
      header .title {
        font-weight: 700;
        font-size: 17px;
      }
      header .sp {
        flex: 1;
      }
      header .ghost {
        padding: 8px 12px;
        font-size: 18px;
      }

      button {
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 16px;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      button.primary {
        background: var(--ok);
        border-color: var(--ok);
        color: #07120c;
        font-weight: 700;
      }
      button.ghost {
        background: none;
        border-color: transparent;
        color: var(--dim);
      }
      button[disabled] {
        opacity: 0.35;
      }

      .wrap {
        padding: 16px;
        max-width: 620px;
        margin: 0 auto;
      }
      .muted {
        color: var(--dim);
        font-size: 14px;
      }
      .err {
        color: var(--bad);
        font-size: 14px;
        min-height: 20px;
        margin-top: 8px;
      }

      /* password */
      .gate {
        padding: 32px 20px;
        max-width: 420px;
        margin: 0 auto;
      }
      .gate h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      .gate input {
        width: 100%;
        font: inherit;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        margin: 16px 0 12px;
      }
      .gate button {
        width: 100%;
      }

      /* court list */
      h3.sec {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--dim);
        margin: 22px 0 8px;
        font-weight: 700;
      }
      .match {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 8px;
        padding: 14px;
      }
      .match .top {
        display: flex;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
        color: var(--dim);
      }
      .match .teams {
        margin-top: 6px;
        font-weight: 600;
        line-height: 1.35;
      }
      .match .score {
        float: right;
        color: var(--ok);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .match.tbd {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .match.now {
        border-color: var(--a);
      }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        border: 1px solid var(--line);
      }
      .badge.live {
        background: var(--a);
        color: #04141f;
        border-color: var(--a);
        font-weight: 700;
      }

      /* scoring */
      .meta {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .games {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .game {
        font-size: 13px;
        color: var(--dim);
        border: 1px solid var(--line);
        padding: 3px 9px;
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }
      .side {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
        width: 100%;
        text-align: left;
      }
      .side.a {
        border-left: 5px solid var(--a);
      }
      .side.b {
        border-left: 5px solid var(--b);
      }
      .side.serving {
        box-shadow: inset 0 0 0 1px var(--ok);
      }
      .side .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .side .name {
        flex: 1;
        font-weight: 600;
        word-break: break-word;
      }
      .side .pts {
        font-size: 54px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .dots {
        display: inline-flex;
        gap: 3px;
        margin-left: 8px;
        vertical-align: middle;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }
      .hint {
        font-size: 12px;
        color: var(--dim);
        margin-top: 6px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }
      .actions button {
        flex: 1;
      }
      .banner {
        background: var(--ok);
        color: #07120c;
        font-weight: 700;
        text-align: center;
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .strip {
        background: var(--warn);
        color: #1a1400;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .so {
        background: var(--warn);
        color: #1a1400;
        text-align: center;
        font-weight: 700;
        padding: 8px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .setuprow {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .setuprow .lbl {
        flex: 0 0 5.5rem;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--dim);
        font-weight: 700;
      }
      .setuprow .who {
        flex: 1;
      }
      .setuprow .tapme {
        font-size: 11px;
        color: var(--dim);
      }
      .pname {
        display: block;
        font-size: 20px;
        font-weight: 700;
      }
      .tname {
        display: block;
        font-size: 12px;
        color: var(--dim);
        margin-top: 2px;
      }
      .role {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--dim);
        font-weight: 700;
        margin-bottom: 2px;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      /* One style, not two: with no words on it, a second colour would be a code
     with nothing to decode it against. */
      .box {
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
        color: var(--ok);
      }
      .courts {
        display: flex;
      }
      .courts.as-stack {
        flex-direction: column;
      }
      .courts.as-side {
        flex-direction: row;
        gap: 10px;
        align-items: stretch;
      }
      .courts.as-side .side {
        flex: 1 1 0;
        min-width: 0;
        width: auto;
        margin-bottom: 0;
      }
      .courts.as-side .row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .courts.as-side .right {
        width: 100%;
        justify-content: space-between;
      }
      .courts.as-side .pts {
        font-size: 44px;
      }
      /* A phone held upright: the two teams share the screen down to the Undo
     button, so whichever side won the rally is a big target. fitCourts() sets
     the height. */
      @media (orientation: portrait) and (max-width: 700px) {
        .courts.scoring.as-stack .side {
          flex: 1 1 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          min-height: 0;
        }
        .courts.scoring.as-stack .pts {
          font-size: 72px;
        }
        .courts.scoring.as-stack .pname {
          font-size: 24px;
        }
      }
      .note {
        display: block;
        font-size: 12px;
        color: var(--warn);
        margin-top: 3px;
      }
      .who-sheet {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .whohead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .whoteam {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        font-weight: 700;
        margin: 10px 0 6px;
      }
      .whorow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .whoname {
        flex: 0 0 5.5rem;
        font-weight: 600;
      }
      .whorow input {
        flex: 1 1 0;
        min-width: 0;
        font: inherit;
        padding: 9px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
      }
      .warnbox {
        background: rgba(224, 168, 0, 0.15);
        color: var(--warn);
        border: 1px solid var(--warn);
        border-radius: 10px;
        padding: 10px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .typein {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .typerow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .typerow span {
        flex: 0 0 4.5rem;
        font-size: 13px;
      }
      /* min-width:0 or the inputs refuse to shrink and the row runs off the edge */
      .typerow input {
        flex: 1 1 0;
        min-width: 0;
        font: inherit;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      /* Teams changing ends: a pop-up the referee has to clear, so it can't be missed. */
      .endspop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(8, 16, 36, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: endsin 0.2s ease-out;
      }
      .endscard {
        background: #fff;
        color: #0b1b3a;
        border-radius: 20px;
        padding: 28px 22px 22px;
        width: 100%;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .endsicon {
        font-size: 60px;
        line-height: 1;
      }
      .endst {
        font-size: 34px;
        font-weight: 800;
        margin: 10px 0 6px;
      }
      .endsd {
        font-size: 18px;
        line-height: 1.35;
        margin: 0 0 22px;
      }
      .endscard button {
        width: 100%;
        min-height: 60px;
        font-size: 22px;
      }
      @keyframes endsin {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .endspop {
          animation: none;
        }
      }
    </style>
    <link rel="stylesheet" href="ref-sign.css" />
    <script src="ref-sign.js" defer></script>
    <link rel="stylesheet" href="ref-toss.css" />
    <script src="ref-toss.js"></script>
  </head>
  <body>
    <div id="strip"></div>
    <header>
      <span class="title" id="hTitle">Referee</span>
      <span class="sp"></span>
      <button class="ghost" id="hWho" hidden title="Who's who">☰</button>
      <button class="ghost" id="hView" hidden title="Tap until the arrows match the court"></button>
      <button class="ghost" id="hBack" hidden>Court</button>
      <button class="ghost" id="hLayout" onclick="switchLayout()" style="font-size: 14px">
        New layout
      </button>
    </header>
    <div id="app" class="wrap"></div>

    <script>
      /* ─────────────── where we are ─────────────── */
      const params = new URLSearchParams(location.search);
      const TOURNAMENT = params.get('tournament');
      const COURT = params.get('court');
      const OPEN_MATCH = params.get('match'); // opened straight from the results page
      const RESUME = params.get('resume'); // reopen this match: the layout was just switched
      const PW_KEY = `ref.pw.${TOURNAMENT}`;
      const PENDING_KEY = `ref.pending.${TOURNAMENT}`;

      let password = localStorage.getItem(PW_KEY) || '';
      let court = null; // {court_name, matches:[...]}
      let match = null; // the one being scored
      let error = '';

      /* ─────────────── live state of the match in hand ─────────────── */
      let games = [],
        s1 = 0,
        s2 = 0,
        serving = 1,
        serverNum = 2,
        firstServer = 1;
      let gameOver = false,
        matchOver = false,
        sideOutFlash = false,
        typing = false;
      /* Setup, before Start is pressed. The referee is the only one who can know any
   of this — it's decided by a spin at the net. */
      let setup = null; // {servingTeam, serverAnchorId, receiverAnchorId}
      let whoOpen = false;
      let serverAnchorId = null,
        receiverAnchorId = null,
        currentServerId_ = null;
      /* How the two courts are drawn, matching how the referee is looking at the real
   court. One button, two layouts.

     stack  the net runs across the screen, one court above the other
     side   the net runs down the screen, courts left and right

   The even court is on a player's right as they face the net, so which way the
   arrow points falls out of the layout and which court is which.
*/
      let layout = localStorage.getItem('ref.layout') === 'side' ? 'side' : 'stack';
      let flipped = localStorage.getItem('ref.flip') === '1';
      /* Switching ends mid-game turns the drawing half a turn, so each team is drawn
   at the end it has moved to. */
      function flippedNow() {
        return flipped !== endsSwitched();
      }

      /* The pool's rules can have teams change ends mid-way through the last game
   (the only game, or game three of a best-of-three) once a team reaches half the
   target: 6 in a game to 11, 8 to 15, 11 to 21. Worked out from the score, never
   stored, so undo and a referee taking the court over both get it right. */
      function switchEndsAt() {
        return Math.ceil(match.play_to / 2);
      }
      function endsSwitched() {
        if (!match || !match.switch_ends) return false;
        const gameNo = matchOver ? games.length : games.length + 1;
        return gameNo === match.best_of && Math.max(s1, s2) >= switchEndsAt();
      }

      /* first = the court drawn top (stacked) or left (side by side) */
      function arrowFor(isFirstSlot) {
        const near = isFirstSlot !== flippedNow();
        if (layout === 'stack') return near ? '←' : '→'; // top faces down, right is screen-left
        return near ? '↓' : '↑'; // left faces right, right is screen-down
      }
      function layoutLabel() {
        return layout === 'stack' ? 'Stacked' : 'Side by side';
      }
      let undoSteps = 0;

      /* ─────────────── talking to Bracket ─────────────── */
      /* A referee has the event password. An organizer opening a match from the
   results page is already logged in and shouldn't have to know it. */
      function organiserToken() {
        try {
          return JSON.parse(localStorage.getItem('login') || 'null')?.access_token || '';
        } catch {
          return '';
        }
      }
      function authHeaders() {
        if (password) return { 'X-Referee-Password': password };
        const tok = organiserToken();
        return tok ? { Authorization: `bearer ${tok}` } : {};
      }

      async function api(method, path, body) {
        const res = await fetch(`/api${path}`, {
          method,
          headers: { ...authHeaders(), ...(body ? { 'content-type': 'application/json' } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 401) {
          throw new Error('unauthorised');
        }
        if (!res.ok) {
          throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
        }
        return res.json();
      }

      /* Points are held here and pushed up. If the network drops mid-match the
   referee carries on scoring and it catches up — losing a match to a dead
   wifi spot is the one failure that matters. */
      function queue(item) {
        const q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
        q.push(item);
        localStorage.setItem(PENDING_KEY, JSON.stringify(q.slice(-40)));
        renderStrip();
      }
      async function flush() {
        let q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
        if (!q.length) return;
        const left = [];
        for (const item of q) {
          try {
            await api('PUT', item.path, item.body);
          } catch {
            left.push(item);
          }
        }
        localStorage.setItem(PENDING_KEY, JSON.stringify(left));
        renderStrip();
      }
      function pendingCount() {
        return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]').length;
      }

      /* Every change is sent on its own, and they are chained so they arrive in the
   order they happened.

   These used to be debounced, which quietly broke undo: four quick taps
   collapsed into one save, so only one state was ever recorded and undoing
   jumped straight back past all four. A rally is a small request and there are
   only tens of them in a match — correctness is worth more than the saving. */
      let pushChain = Promise.resolve();
      function push() {
        if (!match) return;
        const path = `/tournaments/${TOURNAMENT}/matches/${match.match_id}/scoring`;
        const body = {
          games,
          current_score1: s1,
          current_score2: s2,
          serving_team: serving,
          server_number: serverNum,
          first_server_team: firstServer,
          server_anchor_player_id: serverAnchorId,
          receiver_anchor_player_id: receiverAnchorId,
          current_server_player_id: currentServerId_,
          status: matchOver ? 'FINISHED' : 'IN_PROGRESS',
        };
        undoSteps += 1;
        pushChain = pushChain.then(async () => {
          try {
            await api('PUT', path, body);
            await flush();
          } catch {
            queue({ path, body });
          }
        });
      }

      /* ─────────────── positions ───────────────
   USAP 4.B.6.b: when a team's score is even, that team's starting server for
   the game stands in the even court; when odd, the odd court. Their partner is
   always in the other box. Everything below follows from that.
*/
      function playersOf(team) {
        return team === 1 ? match.team1_players : match.team2_players;
      }
      function scoreOf(team) {
        return team === 1 ? s1 : s2;
      }
      function noteOf(id) {
        const p = [...(match?.team1_players || []), ...(match?.team2_players || [])].find(
          (x) => x.id === id,
        );
        return p ? p.note || '' : '';
      }
      function nameOf(id) {
        const p = [...(match.team1_players || []), ...(match.team2_players || [])].find(
          (x) => x.id === id,
        );
        return p ? p.name : '';
      }

      /* The team that began the game serving owns the server anchor; the other team
   owns the receiver anchor. */
      function anchorOf(team) {
        return team === firstServer ? serverAnchorId : receiverAnchorId;
      }
      function partnerOf(team, id) {
        const ps = playersOf(team) || [];
        const other = ps.find((p) => p.id !== id);
        return other ? other.id : null;
      }
      /* Who stands in which box, from that team's own score. */
      function playerInBox(team, box) {
        const anchor = anchorOf(team);
        if (anchor == null) return null;
        const anchorBox = scoreOf(team) % 2 === 0 ? 'even' : 'odd';
        return box === anchorBox ? anchor : partnerOf(team, anchor);
      }
      function boxOfPlayer(team, id) {
        return playerInBox(team, 'even') === id ? 'even' : 'odd';
      }

      /* Who has the ball is tracked, not worked out. The opening turn of a game
   breaks any pattern you might infer it from: the starting team gets one
   server, called the *second* server, who keeps serving and keeps changing
   boxes for as long as they score. */
      function currentServerId() {
        return currentServerId_;
      }
      function currentReceiverId() {
        const receivingTeam = serving === 1 ? 2 : 1;
        // The receiver stands diagonally opposite — same box name, other end.
        const serverBox = boxOfPlayer(serving, currentServerId());
        return playerInBox(receivingTeam, serverBox);
      }

      /* ─────────────── the rules ───────────────
   Side-out is lifted from the scoreboard app, generalised for win-by-2:

     serving team wins the rally  → a point, same server
     receiving team wins          → no point; 1st server becomes 2nd,
                                    2nd server means side out
*/
      function gameWonBy(a, b) {
        const hi = Math.max(a, b),
          lo = Math.min(a, b);
        if (hi < match.play_to || hi - lo < match.win_by) return null;
        return a > b ? 1 : 2;
      }
      function gamesWon() {
        return [games.filter(([a, b]) => a > b).length, games.filter(([a, b]) => b > a).length];
      }
      function neededToWin() {
        return Math.floor(match.best_of / 2) + 1;
      }

      function wonRally(team) {
        if (gameOver || matchOver) return;
        sideOutFlash = false;
        const wasSwitched = endsSwitched();

        if (match.scoring_type === 'RALLY') {
          // Every rally scores, and the winner takes the serve.
          if (team === 1) s1 += 1;
          else s2 += 1;
          serving = team;
          currentServerId_ = playerInBox(team, scoreOf(team) % 2 === 0 ? 'even' : 'odd');
        } else if (team === serving) {
          if (serving === 1) s1 += 1;
          else s2 += 1;
          // Same server, and they swap boxes with their partner — so who is serving
          // doesn't change, only where they stand.
        } else if (serverNum === 1) {
          // Server one lost: their partner takes over from the other box.
          serverNum = 2;
          currentServerId_ = partnerOf(serving, currentServerId_);
        } else {
          serving = serving === 1 ? 2 : 1;
          serverNum = 1;
          sideOutFlash = true;
          // 4.B.6.c: service begins with whoever is correctly in the even court.
          currentServerId_ = playerInBox(serving, 'even');
        }

        if (gameWonBy(s1, s2) !== null) endGame();
        if (!wasSwitched && endsSwitched())
          showEndsPopup(
            `${match.team1} and ${match.team2} change sides at ${Math.max(s1, s2)}. The court on screen has turned to match.`,
          );
        render();
        push();
      }

      function endGame() {
        games.push([s1, s2]);
        const [w1, w2] = gamesWon();
        if (Math.max(w1, w2) >= neededToWin()) {
          matchOver = true;
          gameOver = true;
          return;
        }
        // A new game needs its own starting servers, and the teams change ends — so
        // the referee sets it up again rather than the app guessing.
        s1 = 0;
        s2 = 0;
        gameOver = false;
        // Teams change ends after every game.
        flipped = !flipped;
        localStorage.setItem('ref.flip', flipped ? '1' : '0');
        showEndsPopup(
          `Game ${games.length} done. ${match.team1} and ${match.team2} change sides for game ${games.length + 1}. The court on screen has turned to match.`,
        );
        setup = nextGameSetup();
        // Saved blank, so leaving the match here comes back to this setup, not the last game's serve.
        serverAnchorId = null;
        receiverAnchorId = null;
        currentServerId_ = null;
      }

      function nextGameSetup() {
        const servingTeam = firstServer === 1 ? 2 : 1;
        const sp = playersOf(servingTeam) || [];
        const rp = playersOf(servingTeam === 1 ? 2 : 1) || [];
        return {
          servingTeam,
          serverAnchorId: (sp[0] || {}).id ?? null,
          receiverAnchorId: (rp[0] || {}).id ?? null,
        };
      }

      /* Undo lives on the server, so it survives leaving the match and works for
   whoever takes the court over next. */
      async function undo() {
        if (undoSteps <= 0) return;
        try {
          // Any point still queued has to land first, or it would come back after.
          await flush();
          const betweenGames = setup != null;
          const d = (
            await api('POST', `/tournaments/${TOURNAMENT}/matches/${match.match_id}/scoring/undo`)
          ).data;
          loadFrom(d, match);
          // Back into the last game, so the teams are back at its ends.
          if (betweenGames) {
            flipped = !flipped;
            localStorage.setItem('ref.flip', flipped ? '1' : '0');
          }
          undoSteps -= 1;
          sideOutFlash = false;
          endsPopup = null;
        } catch (e) {
          error = e.message;
        }
        render();
      }

      /* ─────────────── screens ─────────────── */
      function renderStrip() {
        const n = pendingCount();
        document.getElementById('strip').innerHTML = n
          ? `<div class="strip">${n} update${n > 1 ? 's' : ''} waiting to send — keep this page open</div>`
          : '';
      }

      function render() {
        renderPage();
        fitCourts();
        renderEndsPopup();
      }

      /* Teams changing ends is easy to miss with eyes on the ball, so it gets a
   pop-up the referee has to tap away, drawn outside the page so a re-render
   doesn't clear it. */
      let endsPopup = null; // the line under "Switch ends", while it's up
      function showEndsPopup(text) {
        endsPopup = text;
        try {
          navigator.vibrate?.([200, 100, 200]);
        } catch {}
      }
      function closeEndsPopup() {
        endsPopup = null;
        render();
      }
      function renderEndsPopup() {
        let el = document.getElementById('endsPopup');
        if (endsPopup == null) {
          el?.remove();
          return;
        }
        if (!el) {
          el = document.createElement('div');
          el.id = 'endsPopup';
          el.className = 'endspop';
          document.body.appendChild(el);
        }
        el.innerHTML = `<div class="endscard" role="alertdialog" aria-labelledby="endsT" aria-describedby="endsD">
      <div class="endsicon" aria-hidden="true">⇅</div>
      <div class="endst" id="endsT">Switch ends</div>
      <p class="endsd" id="endsD">${esc(endsPopup)}</p>
      <button class="primary" onclick="closeEndsPopup()" autofocus>OK</button>
    </div>`;
      }
      /* The other end for each team: the drawing turns half a turn. */
      function switchEnds() {
        flipped = !flipped;
        localStorage.setItem('ref.flip', flipped ? '1' : '0');
        render();
      }

      /* On a phone held upright, stretch the two teams from where they start down to
   just above the hint and Undo under them, so they fill the screen. */
      const UPRIGHT_PHONE = window.matchMedia('(orientation: portrait) and (max-width: 700px)');
      function fitCourts() {
        const courts = document.querySelector('.courts.scoring.as-stack');
        if (!courts) return;
        if (!UPRIGHT_PHONE.matches) {
          courts.style.height = '';
          return;
        }
        let below = 0;
        for (
          let el = courts.nextElementSibling;
          el && !el.classList.contains('typein');
          el = el.nextElementSibling
        ) {
          const style = getComputedStyle(el);
          below += el.offsetHeight + parseFloat(style.marginTop) + parseFloat(style.marginBottom);
        }
        const top = courts.getBoundingClientRect().top + window.scrollY;
        courts.style.height = `${Math.max(300, window.innerHeight - top - below - 16)}px`;
      }
      window.addEventListener('resize', fitCourts);

      function renderPage() {
        renderStrip();
        const app = document.getElementById('app');
        document.getElementById('hBack').hidden = !match;
        /* Up here rather than beside the scoring buttons: a referee taking over a
     court mid-match walks straight past setup, and the view preference lives on
     their phone, not on the match — so they need to reach it without a mis-tap
     risk next to the score. */
        const viewBtn = document.getElementById('hView');
        viewBtn.hidden = !match;
        viewBtn.textContent = layout === 'stack' ? '⇅' : '⇄';
        document.getElementById('hWho').hidden = !match;

        if (!TOURNAMENT || (!COURT && !OPEN_MATCH)) {
          document.getElementById('hTitle').textContent = 'Referee';
          app.innerHTML = `<p class="muted">This link is missing its court. Scan the code on the net post.</p>`;
          return;
        }
        if (!password && !organiserToken()) return renderGate(app);
        if (match && setup) return renderSetup(app);
        if (match) return renderScoring(app);
        return renderCourt(app);
      }

      function renderGate(app) {
        document.getElementById('hTitle').textContent = 'Referee';
        app.innerHTML = `
    <div class="gate">
      <h1>Court ${esc(COURT)}</h1>
      <p class="muted">Enter the password for this event. You'll only be asked once on this phone.</p>
      <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="Password">
      <button class="primary" onclick="submitPassword()">Continue</button>
      <div class="err">${esc(error)}</div>
    </div>`;
        document.getElementById('pw').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') submitPassword();
        });
        document.getElementById('pw').focus();
      }

      async function submitPassword() {
        password = document.getElementById('pw').value.trim();
        error = '';
        try {
          await loadCourt();
          localStorage.setItem(PW_KEY, password);
        } catch (e) {
          password = '';
          error = e.message === 'unauthorised' ? 'That password is not right.' : e.message;
        }
        render();
      }

      async function loadCourt() {
        if (!COURT) {
          court = { court_name: '', matches: [] };
          return;
        }
        court = await api('GET', `/tournaments/${TOURNAMENT}/referee/courts/${COURT}/matches`);
      }

      /* Opened straight from the results page: fetch that one match and go into it,
   with no list to come from. */
      async function openDirectMatch(id) {
        const res = await api('GET', `/tournaments/${TOURNAMENT}/referee/matches/${id}`);
        court = { court_name: res.court_name, matches: [res.match] };
        await openMatch(res.match.match_id);
      }

      /* Two layouts to try at the net: this one, and the new one. The choice is
   kept on this phone, and ref.html (the QR codes, the results page) opens
   whichever was picked last. Scores waiting to send are shared, so nothing is
   lost switching mid-day. */
      function switchLayout() {
        try {
          localStorage.setItem('ref.ui', 'glass');
        } catch (e) {}
        // Reopen the match on screen in the other layout. A game under way carries
        // on from the server's score; one still being set up starts its setup again.
        const next = new URLSearchParams(location.search);
        next.delete('resume');
        if (match && !OPEN_MATCH) next.set('resume', match.match_id);
        flush()
          .catch(() => {})
          .finally(() => {
            location.href = 'ref.html?' + next;
          });
      }

      function renderCourt(app) {
        document.getElementById('hTitle').textContent = esc(courtLabel(court?.court_name || COURT));
        if (!court) {
          app.innerHTML = '<p class="muted">Loading…</p>';
          return;
        }

        const live = court.matches.filter((m) => m.status === 'IN_PROGRESS');
        const upcoming = court.matches.filter((m) => m.status === 'NOT_STARTED');
        const done = court.matches.filter((m) => m.status === 'FINISHED');

        // A match with a side still TBD can't be opened until both teams are known.
        const tbd = (m) => m.ready === false && m.status === 'NOT_STARTED';
        const row = (m, cls = '') => `
    <button class="match ${cls} ${tbd(m) ? 'tbd' : ''}" onclick="openMatch(${m.match_id})"
      ${tbd(m) ? 'disabled' : ''}>
      <div class="top">
        <span>#${m.match_id}</span>
        <span>${m.start_time ? hhmm(m.start_time) : ''}</span>
        <span>${esc(m.pool)}</span>
        ${m.status === 'IN_PROGRESS' ? '<span class="badge live">LIVE</span>' : ''}
        ${m.best_of > 1 ? `<span class="badge">best of ${m.best_of}</span>` : ''}
        ${tbd(m) ? '<span class="badge">waiting for teams</span>' : ''}
      </div>
      <div class="teams">
        ${m.status !== 'NOT_STARTED' ? `<span class="score">${scoreLabel(m)}</span>` : ''}
        ${esc(m.team1)}<br>${esc(m.team2)}
      </div>
    </button>`;

        app.innerHTML =
          (live.length
            ? `<h3 class="sec">On now</h3>${live.map((m) => row(m, 'now')).join('')}`
            : '') +
          (upcoming.length
            ? `<h3 class="sec">Up next</h3>${upcoming.map((m) => row(m)).join('')}`
            : '') +
          (done.length
            ? `<h3 class="sec">Finished — tap to fix a score</h3>${done.map((m) => row(m)).join('')}`
            : '') +
          (court.matches.length ? '' : '<p class="muted">Nothing scheduled on this court.</p>') +
          (error ? `<div class="err">${esc(error)}</div>` : '');
      }

      function scoreLabel(m) {
        if (m.games.length) return m.games.map((g) => g.join('–')).join('  ');
        return `${m.current_score1}–${m.current_score2}`;
      }

      async function openMatch(id) {
        const m = court.matches.find((x) => x.match_id === id);
        if (!m) return;
        if (m.ready === false && m.status === 'NOT_STARTED') {
          // A side is still TBD: there's nobody to score until the teams are known.
          error = 'Both teams aren’t known yet, so this match can’t start.';
          render();
          return;
        }
        error = '';
        match = m;
        setup = null;
        typing = false;
        undoSteps = m.undo_steps || 0;

        try {
          // Already under way? Pick it up where it was left.
          const d = (await api('GET', `/tournaments/${TOURNAMENT}/matches/${id}/scoring`)).data;
          loadFrom(d, m);
        } catch (e) {
          if (e.message !== 'unauthorised') {
            // Not started: it's set up at the net first. Nobody at a desk can know
            // who is serving or receiving, so this can't be filled in ahead of time.
            beginSetup(m);
          } else {
            error = e.message;
          }
        }
        render();
      }

      function loadFrom(d, m) {
        games = d.games || [];
        s1 = d.current_score1;
        s2 = d.current_score2;
        serving = d.serving_team;
        serverNum = d.server_number;
        firstServer = d.first_server_team;
        serverAnchorId = d.server_anchor_player_id;
        receiverAnchorId = d.receiver_anchor_player_id;
        currentServerId_ = d.current_server_player_id;
        matchOver = d.status === 'FINISHED';
        gameOver = matchOver;
        setup = null;
        undoSteps = Math.max(0, undoSteps);
        // The format copied when the game started beats the pool's current rules.
        match = {
          ...m,
          scoring_type: d.scoring_type,
          play_to: d.play_to,
          win_by: d.win_by,
          best_of: d.best_of,
        };
        // Between games: the next game's serve hasn't been set up yet.
        if (games.length && !matchOver && !s1 && !s2 && serverAnchorId == null)
          setup = nextGameSetup();
      }

      function defaultSetup(m) {
        return {
          servingTeam: 1,
          serverAnchorId: (m.team1_players[0] || {}).id ?? null,
          receiverAnchorId: (m.team2_players[0] || {}).id ?? null,
        };
      }

      /* Tapping a name swaps to their partner. */
      function cycleSetup(which) {
        const team = which === 'server' ? setup.servingTeam : setup.servingTeam === 1 ? 2 : 1;
        const ps = playersOf(team) || [];
        if (ps.length < 2) return;
        const key = which === 'server' ? 'serverAnchorId' : 'receiverAnchorId';
        const idx = ps.findIndex((p) => p.id === setup[key]);
        setup[key] = ps[(idx + 1) % ps.length].id;
        render();
      }

      /* Move the serving flag to the other team.

   The same two people stay chosen — they just swap roles, so whoever was down
   to serve is now down to receive. Resetting the names here would throw away a
   choice the referee had already made. */
      function swapServingTeam() {
        setup.servingTeam = setup.servingTeam === 1 ? 2 : 1;
        [setup.serverAnchorId, setup.receiverAnchorId] = [
          setup.receiverAnchorId,
          setup.serverAnchorId,
        ];
        render();
      }

      function toggleLayout() {
        layout = layout === 'stack' ? 'side' : 'stack';
        localStorage.setItem('ref.layout', layout);
        render();
      }

      async function startGame() {
        // A later game. The server keeps what it has when a match that's under way is
        // started again, so this game's serve goes up like any other change.
        if (games.length) {
          serving = setup.servingTeam;
          firstServer = setup.servingTeam;
          serverNum = match.scoring_type === 'SIDEOUT' ? 2 : 1;
          serverAnchorId = setup.serverAnchorId;
          receiverAnchorId = setup.receiverAnchorId;
          currentServerId_ = setup.serverAnchorId;
          setup = null;
          render();
          push();
          return;
        }
        try {
          const d = (
            await api(
              'POST',
              `/tournaments/${TOURNAMENT}/matches/${match.match_id}/scoring/start`,
              {
                first_server_team: setup.servingTeam,
                server_anchor_player_id: setup.serverAnchorId,
                receiver_anchor_player_id: setup.receiverAnchorId,
              },
            )
          ).data;
          loadFrom(d, match);
          undoSteps = 0; // a game starting is as far back as it goes
        } catch (e) {
          error = e.message;
        }
        render();
      }

      /* Who's who. Referees don't know 200 names but they can see a blue cap, and it
   changes when somebody swaps a sweaty shirt — so these are editable, not
   written once. It lives up here because on the scoring screen a player's name
   is the button for winning a rally. */
      function whoSheet() {
        const rows = [
          [match.team1, match.team1_players || []],
          [match.team2, match.team2_players || []],
        ]
          .map(
            ([team, ps]) => `
    <div class="whoteam">${esc(team)}</div>
    ${
      ps
        .map(
          (p) => `
      <div class="whorow">
        <span class="whoname">${esc(p.name)}</span>
        <input id="note_${p.id}" placeholder="blue cap, left-handed…"
               value="${esc(p.note || '')}"
               onchange="saveNote(${p.id}, this.value)">
      </div>`,
        )
        .join('') || '<div class="muted">No players entered for this team.</div>'
    }
  `,
          )
          .join('');

        return `<div class="who-sheet">
    <div class="whohead">
      <strong>Who's who</strong>
      <button class="ghost" onclick="whoOpen=false; render()">Close</button>
    </div>
    ${rows}
    <p class="muted" style="margin:8px 0 0">Saved as you type. Clear it to remove.</p>
  </div>`;
      }

      async function saveNote(playerId, value) {
        try {
          await api('PUT', `/tournaments/${TOURNAMENT}/referee/players/${playerId}/note`, {
            note: value,
          });
          for (const list of [match.team1_players || [], match.team2_players || []]) {
            const p = list.find((x) => x.id === playerId);
            if (p) p.note = value.trim() || null;
          }
        } catch (e) {
          error = e.message;
          render();
        }
      }

      function renderSetup(app) {
        document.getElementById('hTitle').textContent =
          `#${match.match_id} · ${esc(courtLabel(court.court_name || COURT))}`;

        const recvTeam = setup.servingTeam === 1 ? 2 : 1;
        const teamName = (t) => (t === 1 ? match.team1 : match.team2);
        const missing = (playersOf(1) || []).length < 2 || (playersOf(2) || []).length < 2;

        const row = (label, which, team, id) => `
    <button class="side ${team === 1 ? 'a' : 'b'}" onclick="cycleSetup('${which}')">
      <div class="setuprow">
        <span class="lbl">${label}</span>
        <span class="who">
          <span class="pname">${esc(nameOf(id) || '—')}</span>
          <span class="tname">${esc(teamName(team))}</span>
        </span>
        <span class="tapme">tap to swap</span>
      </div>
    </button>`;

        const teamRow = (team) =>
          team === setup.servingTeam
            ? row('Serving', 'server', team, setup.serverAnchorId)
            : row('Receiving', 'receiver', team, setup.receiverAnchorId);
        const row1 = teamRow(1);
        const row2 = teamRow(2);

        app.innerHTML = `
    <div class="meta">
      <span class="muted">${esc(match.pool)}</span>
      <span class="muted">·</span>
      <span class="muted">${match.scoring_type === 'RALLY' ? 'Rally' : 'Side out'} to ${match.play_to}</span>
    </div>
    <p class="muted" style="margin:0 0 14px">
      Set who serves and who receives, then start. Tap a name to swap to their partner.
    </p>

    ${
      missing
        ? `<div class="warnbox">These teams don't have both players entered, so positions
      can't be checked. Scoring still works.</div>`
        : ''
    }

    ${whoOpen ? whoSheet() : ''}
    <div class="courts as-${layout}">${flippedNow() ? row2 + row1 : row1 + row2}</div>

    <div class="actions" style="margin-top:14px">
      <button onclick="swapServingTeam()">Other team serves</button>
      <button onclick="toggleLayout()">${esc(layoutLabel())}</button>
      <button onclick="switchEnds()">Switch ends</button>
    </div>
    <p class="muted" style="margin:10px 0 0">
      Draw the courts the way you're looking at them — stacked if the net runs across your
      view, side by side if it runs away from you. Switch ends until each team is drawn
      at the end it's really at.
    </p>
    <div class="actions" style="margin-top:12px">
      ${games.length && undoSteps > 0 ? `<button onclick="undo()">Undo</button>` : ''}
      ${games.length || match.toss ? '' : `<button onclick="openToss()">Players set up</button>`}
      <button class="primary" onclick="startGame()" ${missing ? '' : ''}>Start</button>
    </div>
    <div class="err">${esc(error)}</div>`;
      }

      function renderScoring(app) {
        document.getElementById('hTitle').textContent =
          `#${match.match_id} · ${esc(courtLabel(court.court_name || COURT))}`;
        const [w1, w2] = gamesWon();
        const sideOut = match.scoring_type === 'SIDEOUT';
        const dots = (t) =>
          sideOut && serving === t && !matchOver
            ? `<span class="dots">${'<span class="dot"></span>'.repeat(serverNum)}</span>`
            : '';

        const receivingTeam = serving === 1 ? 2 : 1;
        const serverId = currentServerId();
        const receiverId = currentReceiverId();
        const knowPositions = serverId != null && receiverId != null;
        /* Just the arrow. It points at the box the player belongs in, drawn for
     wherever the referee is standing — which is the whole answer, so naming the
     box as well is a word to read at a glance that doesn't add anything. */
        const arrow = (box, slotIsFirst) => {
          const even = arrowFor(slotIsFirst);
          const opposite = { '←': '→', '→': '←', '↑': '↓', '↓': '↑' }[even];
          return `<span class="box">${box === 'even' ? even : opposite}</span>`;
        };

        const slot = (role, team, playerId, cls, slotIsFirst) => `
    <button class="side ${cls} ${sideOut && serving === team ? 'serving' : ''}"
            onclick="wonRally(${team})" ${matchOver ? 'disabled' : ''}>
      <div class="row">
        <span class="name">
          <span class="role">${role}</span>
          ${knowPositions ? `<span class="pname">${esc(nameOf(playerId))}</span>` : ''}
          <span class="tname">${esc(team === 1 ? match.team1 : match.team2)}${dots(team)}</span>
          ${noteOf(playerId) ? `<span class="note">${esc(noteOf(playerId))}</span>` : ''}
        </span>
        <span class="right">
          ${knowPositions ? arrow(boxOfPlayer(team, playerId), slotIsFirst) : ''}
          <span class="pts">${team === 1 ? s1 : s2}</span>
        </span>
      </div>
    </button>`;

        /* A box is a team on its court, and teams don't move when the serve changes.
     So the boxes stay put and the Serving / Receiving label moves between them.
     Reordering by role made the names jump from box to box, which is exactly
     what a referee glancing down doesn't want. */
        const teamSlot = (team, cls) =>
          slot(
            team === serving ? 'Serving' : 'Receiving',
            team,
            team === serving ? serverId : receiverId,
            cls,
            team === 1,
          );
        const slot1 = teamSlot(1, 'a');
        const slot2 = teamSlot(2, 'b');

        app.innerHTML = `
    ${whoOpen ? whoSheet() : ''}
    ${matchOver ? `<div class="banner">${esc(w1 > w2 ? match.team1 : match.team2)} wins</div>` : ''}
    ${sideOutFlash ? '<div class="so">SIDE OUT</div>' : ''}
    <div class="meta">
      <span class="muted">${esc(match.pool)}</span>
      <span class="muted">·</span>
      <span class="muted">${sideOut ? 'Side out' : 'Rally'} to ${match.play_to}${match.win_by > 1 ? `, win by ${match.win_by}` : ''}</span>
      ${match.best_of > 1 ? `<span class="muted">· best of ${match.best_of} (${w1}–${w2})</span>` : ''}
    </div>
    ${games.length ? `<div class="games">${games.map((g, i) => `<span class="game">G${i + 1} ${g[0]}–${g[1]}</span>`).join('')}</div>` : ''}

    <div class="courts scoring as-${layout}">${flippedNow() ? slot2 + slot1 : slot1 + slot2}</div>
    <div class="hint">Tap whichever side won the rally.</div>

    <div class="actions">
      <button onclick="undo()" ${undoSteps > 0 ? '' : 'disabled'}>Undo</button>
    </div>
    ${
      matchOver
        ? `<div class="actions" style="margin-top:12px">
      <button class="primary" onclick="openSignatures()">Sign to complete</button>
    </div>`
        : ''
    }

    <div class="typein">
      <button class="ghost" onclick="toggleTypeIn()">${typing ? 'Hide' : 'Type the final score instead'}</button>
      ${
        typing
          ? `
        <p class="muted" style="margin:4px 0 10px">
          For a walkover, a match scored on paper, or fixing a number at the desk.
          ${match.best_of > 1 ? `Fill in as many games as were played.` : ''}
        </p>
        ${Array.from(
          { length: match.best_of },
          (_, i) => `
          <div class="typerow">
            <span class="muted">${match.best_of > 1 ? `Game ${i + 1}` : 'Score'}</span>
            <input type="number" min="0" inputmode="numeric" id="t1_${i}" value="${games[i] ? games[i][0] : ''}">
            <input type="number" min="0" inputmode="numeric" id="t2_${i}" value="${games[i] ? games[i][1] : ''}">
          </div>`,
        ).join('')}
        <div class="actions" style="margin-top:10px">
          <button class="primary" onclick="saveTypedScore()">Save result</button>
        </div>`
          : ''
      }
    </div>
    <div class="err">${esc(error)}</div>`;
      }

      function toggleTypeIn() {
        typing = !typing;
        render();
      }

      /* Straight to a result, skipping the rallies. */
      async function saveTypedScore() {
        const typed = [];
        for (let i = 0; i < match.best_of; i++) {
          const a = document.getElementById(`t1_${i}`).value;
          const b = document.getElementById(`t2_${i}`).value;
          if (a === '' && b === '') continue;
          const [na, nb] = [parseInt(a || '0', 10), parseInt(b || '0', 10)];
          if (na === nb) {
            error = `Game ${i + 1} can't be a draw.`;
            return render();
          }
          typed.push([na, nb]);
        }
        if (!typed.length) {
          error = 'Put a score in first.';
          return render();
        }

        const [w1, w2] = [
          typed.filter((g) => g[0] > g[1]).length,
          typed.filter((g) => g[1] > g[0]).length,
        ];
        if (Math.max(w1, w2) < Math.floor(match.best_of / 2) + 1) {
          error = `Best of ${match.best_of} — someone has to win ${Math.floor(match.best_of / 2) + 1}.`;
          return render();
        }

        games = typed;
        [s1, s2] = typed[typed.length - 1];
        matchOver = true;
        gameOver = true;
        typing = false;
        error = '';
        render();
        push();
      }

      async function backToCourt() {
        if (OPEN_MATCH) {
          // Opened from the results page. A browser won't let this tab close itself, so
          // carry on to the court's matches, or the results for a match with no court.
          const rest = new URLSearchParams(location.search);
          rest.delete('match');
          const next = COURT
            ? `${location.pathname}?${rest}`
            : `/tournaments/${TOURNAMENT}/results`;
          flush()
            .catch(() => {})
            .finally(() => {
              location.replace(next);
            });
          return;
        }
        match = null;
        try {
          await loadCourt();
        } catch (e) {
          error = e.message;
        }
        render();
      }

      /* ─────────────── wiring ─────────────── */
      document.getElementById('hBack').onclick = backToCourt;
      document.getElementById('hView').onclick = toggleLayout;
      document.getElementById('hWho').onclick = () => {
        whoOpen = !whoOpen;
        render();
      };
      function esc(s) {
        return String(s ?? '').replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      }

      // Times come from the server in UTC; show them in the phone's own time.
      function hhmm(iso) {
        const d = new Date(iso);
        return (
          String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
        );
      }

      // Courts may be named "3" or "Court 3"; don't print "Court Court 3".
      function courtLabel(name) {
        const n = String(name ?? '');
        return /^court\b/i.test(n) ? n : `Court ${n}`;
      }

      // Keep the court list fresh while it's on screen; leave a match being scored
      // alone so a refresh can't stamp on the referee's own taps.
      setInterval(async () => {
        await flush();
        if (!match && !OPEN_MATCH && (password || organiserToken()) && TOURNAMENT && COURT) {
          try {
            await loadCourt();
            render();
          } catch {}
        }
      }, 4000);

      (async () => {
        // Once only: a reload after this shouldn't jump back into the match.
        if (RESUME) {
          const rest = new URLSearchParams(location.search);
          rest.delete('resume');
          history.replaceState(null, '', location.pathname + '?' + rest);
        }
        if ((password || organiserToken()) && TOURNAMENT) {
          try {
            if (OPEN_MATCH) await openDirectMatch(OPEN_MATCH);
            else {
              await loadCourt();
              if (RESUME) await openMatch(Number(RESUME));
            }
          } catch (e) {
            if (e.message === 'unauthorised') {
              password = '';
              localStorage.removeItem(PW_KEY);
            } else error = e.message;
          }
        }
        render();
      })();
    </script>
  </body>
</html>
