            trail = [];
            goTo(nav.dataset.nav, { remember: false });
          }
          return;
        }
        const go = event.target.closest('[data-go]');
        if (go) {
          goTo(go.dataset.go);
          return;
        }
        const swap = event.target.closest('[data-swap]');
        if (swap) {
          goTo(swap.dataset.swap, { remember: false });
          return;
        }
        if (event.target.closest('[data-back]')) {
          const previous = trail.pop();
          if (previous == null) goHome('Back pressed');
          else goTo(previous, { remember: false });
        }
      });
      for (const kind of ['pointerdown', 'touchmove', 'wheel', 'keydown']) {
        document.addEventListener(kind, touched, { passive: true });
      }
      document.addEventListener('scroll', touched, { passive: true, capture: true });

      /* A finger resting on the screen holds the timer. Lifting it starts the full count again.
         Touches are counted from touch events, because a pointer is let go as soon as a finger
         starts to scroll, and it's still being held then. */
      let fingers = 0;
      let mouseDown = false;
      const holding = () => fingers > 0 || mouseDown;
      const holdChanged = () => {
        touched();
        tick();
      };
      for (const kind of ['touchstart', 'touchend', 'touchcancel']) {
        document.addEventListener(
          kind,
          (event) => {
            fingers = event.touches.length;
            holdChanged();
          },
          { passive: true },
        );
      }
      document.addEventListener('mousedown', () => {
        mouseDown = true;
        holdChanged();
      });
      // Let go, or gone somewhere it can't be seen letting go.
      for (const kind of ['mouseup', 'mouseleave']) {
        document.addEventListener(kind, () => {
          mouseDown = false;
          holdChanged();
        });
      }
      window.addEventListener('blur', () => {
        mouseDown = false;
        fingers = 0;
        holdChanged();
      });

      /* ---------- What comes in. ---------- */

      function receive(next) {
        if (next.timerSeconds != null) {
          secondsAllowed = next.timerSeconds;
          touched();
          return;
        }
        const courtBefore = homeCourt();
        state = next;
        if (courtBefore && homeCourt() !== courtBefore) goHome('it was moved to another court');
        // Being called to this court can't wait for someone to finish reading.
        // Calling again counts too: it's still somebody who hasn't come.
        const call =
          state.graphic?.stage === 'INTRO'
            ? `${state.graphic.key}:${state.graphic.calls ?? 0}`
            : null;
        if (call != null && call !== lastCall) goHome('teams called, jumped back to the court');
        lastCall = call;
        drawAll();
      }

      document.querySelectorAll('.sponsor').forEach((box) => {
        const image = new Image();
        image.alt = 'Sponsor';
        image.onload = () => box.replaceChildren(image);
        image.src = box.dataset.image;
      });

      if (params.has('preview')) {
        window.addEventListener('message', (event) => {
          if (event.origin !== location.origin || event.source !== window.parent) return;
          receive(event.data);
        });
      }
      /* The real thing: each court's monitor has its court in its link, and asks the server.
         It keeps what it has if the network drops, and carries on when it's back. An empty
         bearer is what the browser sends when nobody is logged in; the API rejects a request
         with no Authorization header at all. */
      let TOURNAMENT = params.get('tournament');
      let COURT = params.get('court');
      const API_HEADERS = { Authorization: 'bearer ' };
      const ASK_EVERY_MS = 1000;
      let asking = false;

      async function askServer() {
        if (asking) return;
        asking = true;
        try {
          const res = await fetch(`/api/tournaments/${TOURNAMENT}/court_screen/${COURT}`, {
            headers: API_HEADERS,
          });
          if (res.ok) receive((await res.json()).data);
        } catch {
          // Tries again in a second.
        }
        asking = false;
      }

      async function signInHere(player) {
        try {
          await fetch(`/api/tournaments/${TOURNAMENT}/court_screen/${COURT}/sign_in`, {
            method: 'POST',
            headers: { ...API_HEADERS, 'Content-Type': 'application/json' },
            body: JSON.stringify({ player_id: player }),
          });
        } catch {
          // They can tap again, or the referee can tick them.
        }
        askServer();
      }

      const startAsking = () => {
        askServer();
        setInterval(askServer, ASK_EVERY_MS);
      };

      /* A board's own link has only its name. It registers itself, the organizer picks its
         court on the Court monitors page, and a new pick takes effect by reloading. */
      const NODE = params.get('node');
      const NODE_ASK_EVERY_MS = 3000;
      let assigned;

      function showWaiting() {
        const cover = document.createElement('div');
        cover.id = 'waiting';
        cover.style.cssText =
          'position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:#0b1530;color:#f4efe2;text-align:center;';
        const name = document.createElement('div');
        name.style.cssText = 'font-size:6rem;font-weight:800;';
        name.textContent = NODE;
        const note = document.createElement('div');
        note.style.cssText = 'font-size:2.4rem;color:#d4af6a;';
        note.textContent = 'Waiting for a court';
        cover.append(name, note);
        document.body.append(cover);
      }

      async function askNode() {
        try {
          const res = await fetch(`/api/monitor_nodes/${encodeURIComponent(NODE)}/check_in`, {
            method: 'POST',
            headers: API_HEADERS,
          });
          if (!res.ok) return;
          const { tournament_id: tournament, court_id: court } = (await res.json()).data;
          const now = court == null ? 'none' : `${tournament}/${court}`;
          if (assigned == null) {
            assigned = now;
            if (court == null) return;
            TOURNAMENT = tournament;
            COURT = court;
            document.getElementById('waiting')?.remove();
            startAsking();
          } else if (now !== assigned) {
            location.reload();
          }
        } catch {
          // Tries again soon.
        }
      }

      /* On a board's own screen, a long hold in the top right corner goes back to its start
         screen, to change the server. Long enough that nobody does it by accident. */
      if (params.has('kiosk')) {
        const HOLD_MS = 5000;
        const CORNER = 160;
        let hold;
        const letGo = () => clearTimeout(hold);
        window.addEventListener('contextmenu', (event) => event.preventDefault());
        window.addEventListener('pointerdown', (event) => {
          if (event.clientX < innerWidth - CORNER || event.clientY > CORNER) return;
          hold = setTimeout(() => {
            location.href = `http://127.0.0.1:8099/start.html?node=${encodeURIComponent(NODE)}&change=1`;
          }, HOLD_MS);
        });
        window.addEventListener('pointerup', letGo);
        window.addEventListener('pointercancel', letGo);
      }

      if (!params.has('preview')) {
        if (NODE) {
          showWaiting();
          askNode();
          setInterval(askNode, NODE_ASK_EVERY_MS);
        } else if (TOURNAMENT && COURT) {
          startAsking();
        }
      }

      const refit = () => {
        showNeedsFit = true;
        drawAll();
      };
      window.addEventListener('resize', refit);
      document.fonts?.ready.then(refit);
      drawAll();
    </script>
  </body>
</html>
